name: ai_auto_caller
description: AI-powered automatic phone call answering application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Phone call handling
  phone_state: ^1.0.2
  call_log: ^4.0.0
  permission_handler: ^11.0.1

  # Networking
  http: ^1.1.0
  dio: ^5.4.0

  # State management
  provider: ^6.1.1
  get: ^4.6.6

  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.36

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/sounds/
